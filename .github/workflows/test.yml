name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

jobs:
  test-core:
    name: Test Core Package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Run core package tests
        run: bun test packages/shortlinks-manager
        env:
          CI: true

  test-cf-d1:
    name: Test Cloudflare D1 Package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Run Cloudflare D1 package tests
        run: bun test packages/shortlinks-manager-cloudflare-d1
        env:
          CI: true

  test-postgres:
    name: Test Postgres Package (PG ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [14, 15, 16, 17, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shortlinks
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Run Postgres package tests
        run: bun test packages/shortlinks-manager-postgres
        env:
          CI: true
          POSTGRES_URI: postgres://postgres:password@localhost:5432/shortlinks

  test-mysql:
    name: Test MySQL Package (${{ matrix.mysql-variant }} ${{ matrix.mysql-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql-variant: mysql
            mysql-version: "8.0"
          - mysql-variant: mariadb
            mysql-version: "10.11"
          - mysql-variant: mariadb
            mysql-version: "11.4"

    services:
      mysql:
        image: ${{ matrix.mysql-variant }}:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: shortlinks
        options: >-
          --health-cmd "${{ matrix.mysql-variant == 'mysql' && 'mysqladmin ping' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Run MySQL package tests
        run: bun test packages/shortlinks-manager-mysql
        env:
          CI: true
          MYSQL_URI: mysql://root:password@localhost:3306/shortlinks
